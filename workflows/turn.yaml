# One user turn: read input, record it, let the agent work. main repeats it until /exit.
name: turn
vars:
  session_file: null
  relay_api_key: null
  request_base: null
steps:
  - name: user_input
    type: prompt
    params:
      message: "\n>"
    register: user_input

  - name: check_quit
    type: set_fact
    vars:
      quit: "user_input.value == '/exit' or user_input.value == '/quit'"

  # What was typed (scripts/input.py): plain text, @agent-<name> mentions (a reminder added), a
  # /<skill> [args] (the skill's instructions), or /agent <type> <task> (run here, no model call).
  - name: expand
    type: script_exec
    when: "not quit"
    params:
      interpreter: python3
      path: input.py
      stdin:
        value: "{{ user_input.value }}"
        skill_dirs: ["{{ markov_source_dir }}/skills", "{{ skills_dir }}", "{{ project_skills_dir }}"]
        agent_dirs: ["{{ markov_source_dir }}/agents", "{{ agents_dir }}", "{{ project_agents_dir }}"]
    register: expand

  - name: user_msg
    type: set_fact
    when: "not quit"
    vars:
      expanded: "{{ expand.stdout | from_json }}"

  - name: check_send
    type: set_fact
    when: "not quit"
    vars:
      send: "not expanded.error and not expanded.command and not expanded.compact"
      direct: "expanded.command and not expanded.error"
      compact_now: "expanded.compact and not expanded.error"
      go: false

  # UserPromptSubmit hooks (scripts/hooks.py prompt): one may add context to the message, or block it.
  - name: prompt_hooks
    type: script_exec
    when: "not quit and send"
    params:
      interpreter: python3
      path: hooks.py
      args: [prompt, "{{ session_file }}", "{{ user_settings }}"]
      stdin:
        message: "{{ expanded.message }}"
        prompt: "{{ user_input.value }}"
    register: prompt_hooks

  - name: parse_prompt_hooks
    type: set_fact
    when: "not quit and send"
    vars:
      hooked: "{{ prompt_hooks.stdout | from_json }}"

  - name: check_go
    type: set_fact
    when: "not quit and send"
    vars:
      go: "not hooked.blocked"
      message: "{{ hooked.message }}"

  - name: show_prompt_hooks
    type: script_exec
    when: "not quit and send and hooked.notes | length > 0"
    params:
      interpreter: python3
      path: show.py
      args: [notes]
      stdin: "{{ hooked.notes }}"

  # /compact [instructions]: summarize the conversation now (no turn follows).
  - name: compact
    workflow: compact
    when: "not quit and compact_now"
    vars:
      session_file: "{{ session_file }}"
      relay_api_key: "{{ relay_api_key }}"
      request_base: "{{ request_base }}"
      manual: true
      instructions: "{{ expanded.compact.instructions }}"

  - name: show_expand
    type: script_exec
    when: "not quit and (expanded.error or expanded.skill or expanded.mentions)"
    params:
      interpreter: python3
      path: show.py
      args: [note, "{% if expanded.error %}{{ expanded.error }}{% elif expanded.skill %}loaded skill {{ expanded.skill }}{% else %}asked for agent {{ expanded.mentions | join:', ' }}{% endif %}"]

  # /agent <type> <task>: the workflow runs the subagent itself, prints its answer, and records the
  # command and its output the way Claude Code records a local command, for the model's next turn.
  - name: command_block
    type: set_fact
    when: "not quit and direct"
    vars:
      block:
        id: "cmd-{{ markov_current_run_id }}"
        name: agent
        input:
          description: "/agent {{ expanded.command.args }}"
          prompt: "{{ expanded.command.prompt }}"
          subagent_type: "{{ expanded.command.subagent_type }}"

  - name: command_agent
    workflow: agent.run
    when: "not quit and direct"
    register: command_agent
    vars:
      block: "{{ block }}"
      session_file: "{{ session_file }}"
      relay_api_key: "{{ relay_api_key }}"
      request_base: "{{ request_base }}"

  - name: command_msg
    type: set_fact
    when: "not quit and direct"
    vars:
      command_message:
        role: user
        content:
          - type: text
            text: "<command-name>/agent</command-name>\n<command-args>{{ expanded.command.args }}</command-args>"
          - type: text
            text: "<local-command-stdout>{% if command_agent.outcome.error %}{{ command_agent.outcome.error }}{% else %}{{ command_agent.outcome.text }}{% endif %}</local-command-stdout>"

  - name: record_command
    type: write_file
    when: "not quit and direct"
    params:
      path: "{{ session_file }}"
      append: true
      content: "{{ command_message | to_json }}\n"

  - name: show_command
    type: script_exec
    when: "not quit and direct and not command_agent.outcome.error"
    params:
      interpreter: python3
      path: show.py
      args: [answer]
      stdin: "{{ command_agent.outcome.text }}"

  - name: record_user
    type: write_file
    when: "not quit and go"
    params:
      path: "{{ session_file }}"
      append: true
      content: "{{ message | to_json }}\n"

  - name: agent
    workflow: agent_step
    when: "not quit and go"
    register: agent
    vars:
      session_file: "{{ session_file }}"
      relay_api_key: "{{ relay_api_key }}"
      request_base: "{{ request_base }}"
    repeat:
      until: "not keep_going"
      max: "{{ max_tool_rounds }}"
      on_max: stop

  - name: tool_limit
    type: script_exec
    when: "not quit and go and agent.stopped_by == 'max'"
    params:
      interpreter: python3
      path: show.py
      args: [note, "stopped after {{ max_tool_rounds }} model calls in this turn (max_tool_rounds); the model was still asking for tools"]

  - name: extract
    workflow: extract.memories
    when: "not quit and go and extract_memories"
    vars:
      session_file: "{{ session_file }}"
      relay_api_key: "{{ relay_api_key }}"
      request_base: "{{ request_base }}"
