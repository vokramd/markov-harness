# Runs one subagent for a tool_use block (real, from the agent tool, or made by turn for /agent):
# start it (scripts/agents.py), repeat its loop until it stops asking for tools, and collect its answer.
# Leaves `message` (the tool_result answering the block) and `outcome` ({text, error, uses, rounds}).
name: agent.run
vars:
  block: null
  session_file: null
  relay_api_key: null
  request_base: null
steps:
  - name: start
    type: script_exec
    params:
      interpreter: python3
      path: agents.py
      args: [start, "{{ session_file }}", "{{ model }}", "{{ markov_source_dir }}/agents", "{{ agents_dir }}", "{{ project_agents_dir }}"]
      stdin:
        block: "{{ block }}"
        tools: "{{ tools }}"
    register: start

  - name: parse_start
    type: set_fact
    vars:
      started: "{{ start.stdout | from_json }}"

  - name: announce
    type: script_exec
    params:
      interpreter: python3
      path: show.py
      args: [agent, "{% if started.ok %}{{ started.name }}{% else %}Agent{% endif %}", "{{ block.input.description }}"]

  - name: run
    workflow: subagent_step
    when: "started.ok"
    register: run
    vars:
      sub_session: "{{ started.sub_session }}"
      relay_api_key: "{{ relay_api_key }}"
      request_base: "{{ request_base }}"
      agent: "{{ started }}"
      instructions_file: "{{ session_file }}.instructions"
    repeat:
      until: "not ok or reply.stop_reason != 'tool_use'"
      max: "{{ max_tool_rounds }}"
      on_max: stop

  - name: finish
    type: script_exec
    when: "started.ok"
    params:
      interpreter: python3
      path: agents.py
      args: [result, "{{ started.sub_session }}", "{% if not run.last.ok %}failed{% elif run.stopped_by == 'max' %}max{% else %}done{% endif %}"]
      stdin: "{{ block }}"
    register: finish

  # Rendered as JSON text, which set_fact reads back as a map.
  - name: result
    type: set_fact
    vars:
      outcome: "{% if started.ok %}{{ finish.stdout }}{% else %}{\"text\": \"\", \"error\": {{ started.error | to_json }}, \"uses\": 0, \"rounds\": 0}{% endif %}"

  - name: answer
    type: set_fact
    vars:
      message: "{% if started.ok %}{{ outcome.message | to_json }}{% else %}{{ started.message | to_json }}{% endif %}"

  - name: show
    type: script_exec
    params:
      interpreter: python3
      path: show.py
      args: [agent-done, "{{ outcome.uses }}", "{{ outcome.rounds }}"]
      stdin: "{{ message }}"
