# One model call of a subagent, plus the tools it asked for; tools.agent repeats it while the subagent
# wants tool results. Like agent_step, but on the subagent's own session file, system prompt and tools,
# and not streamed: only its tool calls reach the terminal, and its final message goes to the main agent.
name: subagent_step
vars:
  sub_session: null
  relay_api_key: null
  request_base: null
  agent: null          # agents.py start: {system, tools, allowed, model}
  instructions_file: ""   # the main session's CLAUDE.md snapshot (instructions.py context)
  costs_file: ""          # the main session's usage log, for /cost
steps:
  - name: build
    type: script_exec
    params:
      interpreter: python3
      path: history.py
      args: [messages, "{{ sub_session }}", "{{ instructions_file }}"]
    register: history

  - name: call_model
    type: http_request
    params:
      method: POST
      url: "{{ relay_base_url }}/v1/messages"
      headers:
        x-api-key: "{{ relay_api_key }}"
        anthropic-version: "2023-06-01"
      ignore_status: true
      body:
        model: "{{ agent.model }}"
        max_tokens: "{{ max_tokens }}"
        cache_control: {type: ephemeral}
        thinking: "{{ request_base.thinking }}"
        system:
          - type: text
            text: "{{ client_identity }}"
          - type: text
            text: "{{ agent.system }}"
        tools: "{{ agent.tools }}"
        messages: "{{ history.stdout | from_json }}"
    register: response

  - name: assemble
    type: script_exec
    params:
      interpreter: python3
      path: history.py
      args: [assemble]
      stdin: "{{ response }}"
    register: assembled

  - name: parse_reply
    type: set_fact
    vars:
      reply: "{{ assembled.stdout | from_json }}"

  - name: check_ok
    type: set_fact
    vars:
      ok: "not reply.error"
      stop_blocked: false

  - name: show_error
    type: script_exec
    when: "not ok"
    params:
      interpreter: python3
      path: show.py
      args: [error, "{{ reply.status }}"]
      stdin: "{{ reply.error }}"

  - name: assistant_msg
    type: set_fact
    when: "ok"
    vars:
      message:
        role: assistant
        content: "{{ reply.content }}"

  - name: record_assistant
    type: write_file
    when: "ok"
    params:
      path: "{{ sub_session }}"
      append: true
      content: "{{ message | to_json }}\n"

  - name: record_cost
    type: write_file
    when: "ok and costs_file"
    params:
      path: "{{ costs_file }}"
      append: true
      content: "{\"model\": {{ agent.model | to_json }}, \"kind\": \"subagent\", \"usage\": {{ reply.usage | to_json }}}\n"

  # Permission rules and PreToolUse hooks apply to a subagent's calls too (scripts/hooks.py pre).
  - name: gate
    type: script_exec
    when: "ok"
    params:
      interpreter: python3
      path: hooks.py
      args: [pre, "{{ sub_session }}", "{{ user_settings }}"]
      stdin:
        reply: "{{ reply }}"
        approve: "{{ approve }}"
        memory_dir: "{{ memory_dir }}"
        mutating_tools: "{{ mutating_tools }}"
    register: gate

  - name: parse_gate
    type: set_fact
    when: "ok"
    vars:
      gated: "{{ gate.stdout | from_json }}"

  - name: show_gate_notes
    type: script_exec
    when: "ok and gated.notes | length > 0"
    params:
      interpreter: python3
      path: show.py
      args: [notes]
      stdin: "{{ gated.notes }}"

  - name: run_readonly
    when: "ok"
    for_each: gated.calls
    as: call
    for_each_when: "call.decision != 'deny' and call.block.name in readonly_tools and call.block.name in agent.allowed and not (call.block.id in reply.invalid)"
    concurrency: 4
    workflow: "tools.{{ call.block.name }}"
    vars:
      block: "{{ call.block }}"
      session_file: "{{ sub_session }}"

  - name: run_mutating
    when: "ok"
    for_each: gated.calls
    as: call
    for_each_when: "call.decision != 'deny' and call.block.name in mutating_tools and call.block.name in agent.allowed and not (call.block.id in reply.invalid)"
    concurrency: 1
    workflow: "tools.{{ call.block.name }}"
    vars:
      block: "{{ call.block }}"
      session_file: "{{ sub_session }}"
      decision: "{{ call.decision }}"
      reason: "{{ call.reason }}"
      suggest: "{{ call.suggest }}"

  - name: denied_tools
    when: "ok"
    for_each: gated.calls
    as: call
    for_each_when: "call.decision == 'deny'"
    workflow: tools.denied
    vars:
      block: "{{ call.block }}"
      session_file: "{{ sub_session }}"
      reason: "{{ call.reason }}"

  # Anything it may not use, the agent tool included: answered with an error, not run.
  - name: unknown_tools
    when: "ok"
    for_each: gated.calls
    as: call
    for_each_when: "call.decision != 'deny' and (call.block.id in reply.invalid or not (call.block.name in agent.allowed) or not (call.block.name in readonly_tools or call.block.name in mutating_tools))"
    workflow: tools.unknown
    vars:
      block: "{{ call.block }}"
      session_file: "{{ sub_session }}"
      invalid: "{{ call.block.id in reply.invalid }}"

  - name: post_hooks
    type: script_exec
    when: "ok and gated.post"
    params:
      interpreter: python3
      path: hooks.py
      args: [post, "{{ sub_session }}", "{{ user_settings }}"]
      stdin:
        calls: "{{ gated.calls }}"
    register: post_hooks

  - name: parse_post
    type: set_fact
    when: "ok and gated.post"
    vars:
      posted: "{{ post_hooks.stdout | from_json }}"

  - name: record_post
    type: write_file
    when: "ok and gated.post and posted.message"
    params:
      path: "{{ sub_session }}"
      append: true
      content: "{{ posted.message | to_json }}\n"

  - name: show_post_notes
    type: script_exec
    when: "ok and gated.post and posted.notes | length > 0"
    params:
      interpreter: python3
      path: show.py
      args: [notes]
      stdin: "{{ posted.notes }}"

  # SubagentStop hooks, when the subagent is done: one may send it back to work with a reason.
  - name: stop_hooks
    type: script_exec
    when: "ok and reply.stop_reason != 'tool_use'"
    params:
      interpreter: python3
      path: hooks.py
      args: [subagent-stop, "{{ sub_session }}", "{{ user_settings }}", "{{ agent.name }}"]
    register: stop_hooks

  - name: parse_stop
    type: set_fact
    when: "ok and reply.stop_reason != 'tool_use'"
    vars:
      stopped: "{{ stop_hooks.stdout | from_json }}"

  - name: record_stop
    type: write_file
    when: "ok and reply.stop_reason != 'tool_use' and stopped.block"
    params:
      path: "{{ sub_session }}"
      append: true
      content: "{{ stopped.message | to_json }}\n"

  - name: show_stop
    type: script_exec
    when: "ok and reply.stop_reason != 'tool_use' and stopped.notes | length > 0"
    params:
      interpreter: python3
      path: show.py
      args: [notes]
      stdin: "{{ stopped.notes }}"

  - name: stop_check
    type: set_fact
    when: "ok and reply.stop_reason != 'tool_use'"
    vars:
      stop_blocked: "stopped.block"
