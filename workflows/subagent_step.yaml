# One model call of a subagent, plus the tools it asked for; tools.agent repeats it while the subagent
# wants tool results. Like agent_step, but on the subagent's own session file, system prompt and tools,
# and not streamed: only its tool calls reach the terminal, and its final message goes to the main agent.
name: subagent_step
vars:
  sub_session: null
  relay_api_key: null
  request_base: null
  agent: null          # agents.py start: {system, tools, allowed, model}
steps:
  - name: build
    type: script_exec
    params:
      interpreter: python3
      path: history.py
      args: [messages, "{{ sub_session }}"]
    register: history

  - name: call_model
    type: http_request
    params:
      method: POST
      url: "{{ relay_base_url }}/v1/messages"
      headers:
        x-api-key: "{{ relay_api_key }}"
        anthropic-version: "2023-06-01"
      ignore_status: true
      body:
        model: "{{ agent.model }}"
        max_tokens: "{{ max_tokens }}"
        cache_control: {type: ephemeral}
        thinking: "{{ request_base.thinking }}"
        system:
          - type: text
            text: "{{ client_identity }}"
          - type: text
            text: "{{ agent.system }}"
        tools: "{{ agent.tools }}"
        messages: "{{ history.stdout | from_json }}"
    register: response

  - name: assemble
    type: script_exec
    params:
      interpreter: python3
      path: history.py
      args: [assemble]
      stdin: "{{ response }}"
    register: assembled

  - name: parse_reply
    type: set_fact
    vars:
      reply: "{{ assembled.stdout | from_json }}"

  - name: check_ok
    type: set_fact
    vars:
      ok: "not reply.error"

  - name: show_error
    type: script_exec
    when: "not ok"
    params:
      interpreter: python3
      path: show.py
      args: [error, "{{ reply.status }}"]
      stdin: "{{ reply.error }}"

  - name: assistant_msg
    type: set_fact
    when: "ok"
    vars:
      message:
        role: assistant
        content: "{{ reply.content }}"

  - name: record_assistant
    type: write_file
    when: "ok"
    params:
      path: "{{ sub_session }}"
      append: true
      content: "{{ message | to_json }}\n"

  - name: run_readonly
    when: "ok"
    for_each: reply.content
    as: block
    for_each_when: "block.type == 'tool_use' and block.name in readonly_tools and block.name in agent.allowed and not (block.id in reply.invalid)"
    concurrency: 4
    workflow: "tools.{{ block.name }}"
    vars:
      block: "{{ block }}"
      session_file: "{{ sub_session }}"

  - name: run_mutating
    when: "ok"
    for_each: reply.content
    as: block
    for_each_when: "block.type == 'tool_use' and block.name in mutating_tools and block.name in agent.allowed and not (block.id in reply.invalid)"
    concurrency: 1
    workflow: "tools.{{ block.name }}"
    vars:
      block: "{{ block }}"
      session_file: "{{ sub_session }}"

  # Anything it may not use, the agent tool included: answered with an error, not run.
  - name: unknown_tools
    when: "ok"
    for_each: reply.content
    as: block
    for_each_when: "block.type == 'tool_use' and (block.id in reply.invalid or not (block.name in agent.allowed) or not (block.name in readonly_tools or block.name in mutating_tools))"
    workflow: tools.unknown
    vars:
      block: "{{ block }}"
      session_file: "{{ sub_session }}"
      invalid: "{{ block.id in reply.invalid }}"
