name: tools.write_file
vars:
  block: null
  session_file: null
  decision: ask     # from hooks.py pre: allow runs it, ask prompts first (deny never gets here)
  reason: ""        # why it was allowed without asking (a rule or a hook), shown
  suggest: ""       # the allow rule an `a` (always) answer saves
steps:
  - name: announce
    type: script_exec
    params:
      interpreter: python3
      path: show.py
      args: [tool, Write, "{{ block.input.path }}"]

  - name: allowed_note
    type: script_exec
    when: "decision == 'allow' and reason"
    params:
      interpreter: python3
      path: show.py
      args: [note, "{{ reason }}"]

  - name: approval
    type: prompt
    when: "decision == 'ask'"
    params:
      message: "  write it? (a: always)"
      choices: ["y", "n", "a"]
      default: "y"
      case_insensitive: true
    register: approval

  - name: decide
    type: set_fact
    vars:
      approved: "decision == 'allow' or approval.value == 'y' or approval.value == 'a'"

  # `a`: save the rule so the same call isn't asked again (scripts/settings.py add).
  - name: always
    type: script_exec
    when: "decision == 'ask' and approval.value == 'a'"
    params:
      interpreter: python3
      path: settings.py
      args: [add, "{{ suggest }}"]
    register: always

  - name: show_always
    type: script_exec
    when: "decision == 'ask' and approval.value == 'a'"
    params:
      interpreter: python3
      path: show.py
      args: [note, "{{ always.stdout }}"]

  - name: write
    type: write_file
    when: "approved"
    ignore_errors: true
    params:
      path: "{{ block.input.path }}"
      content: "{{ block.input.content }}"
    register: written

  - name: result
    type: set_fact
    vars:
      message:
        role: user
        content:
          - type: tool_result
            tool_use_id: "{{ block.id }}"
            content: "{% if not approved %}The user declined this write.{% elif written.failed %}error: {{ written.error }}{% else %}wrote {{ written.bytes }} bytes to {{ written.path }}{% endif %}"

  - name: record
    type: write_file
    params:
      path: "{{ session_file }}"
      append: true
      content: "{{ message | to_json }}\n"

  # Its content as the session now knows it, so only later changes are reported (scripts/attachments.py).
  - name: track
    type: script_exec
    when: "approved and not written.failed"
    params:
      interpreter: python3
      path: attachments.py
      args: [track, "{{ session_file }}", "{{ block.input.path }}"]

  - name: preview
    type: script_exec
    params:
      interpreter: python3
      path: show.py
      args: [result]
      stdin: "{{ message }}"
