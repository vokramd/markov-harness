name: tools.read_file
vars:
  block: null
  session_file: null
steps:
  - name: read
    type: script_exec
    ignore_errors: true
    params:
      interpreter: python3
      path: search.py
      args: [read]
      stdin: "{{ block.input }}"
    register: read

  - name: result
    type: set_fact
    vars:
      message:
        role: user
        content:
          - type: tool_result
            tool_use_id: "{{ block.id }}"
            is_error: "{{ read.exit_code != 0 }}"
            content: "{% if read.exit_code != 0 %}{{ read.stdout | truncatechars:2000 }}{% else %}{{ read.stdout | truncatechars:max_tool_output }}{% endif %}"

  - name: record
    type: write_file
    params:
      path: "{{ session_file }}"
      append: true
      content: "{{ message | to_json }}\n"

  # CLAUDE.md files of the directories between the work dir and the file, once per session
  # (scripts/instructions.py nested): a reminder after the tool result.
  - name: nested
    type: script_exec
    when: "read.exit_code == 0"
    params:
      interpreter: python3
      path: instructions.py
      args: [nested, "{{ session_file }}", "{{ block.input.path }}"]
    register: nested

  - name: record_nested
    type: write_file
    when: "read.exit_code == 0 and nested.stdout"
    params:
      path: "{{ session_file }}"
      append: true
      content: "{{ nested.stdout | trim }}\n"

  - name: show
    type: script_exec
    params:
      interpreter: python3
      path: show.py
      args: [call, Read, "{{ block.input.path }}"]
      stdin: "{{ message }}"
