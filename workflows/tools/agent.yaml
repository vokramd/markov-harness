# The agent tool: run the subagent (agent.run) and answer the main agent with its final message.
name: tools.agent
vars:
  block: null
  session_file: null
  relay_api_key: null
  request_base: null
steps:
  - name: run
    workflow: agent.run
    register: subagent
    vars:
      block: "{{ block }}"
      session_file: "{{ session_file }}"
      relay_api_key: "{{ relay_api_key }}"
      request_base: "{{ request_base }}"

  - name: record
    type: write_file
    params:
      path: "{{ session_file }}"
      append: true
      content: "{{ subagent.message | to_json }}\n"
