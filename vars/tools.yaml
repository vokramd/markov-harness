# The tools offered to the model. Each one is run by the workflow tools.<name>
# (workflows/tools/<name>.yaml).
# eager_input_streaming: tool input streams as it is written (shown as a running count) instead
# of arriving in one burst; history.py assemble then checks it is a JSON object.
tools:
  - name: bash
    description: Run a bash command in the current working directory and return its stdout, stderr and exit code.
    eager_input_streaming: true
    input_schema:
      type: object
      properties:
        command: {type: string, description: The bash command to run.}
      required: [command]
  - name: read_file
    description: Read a text file and return its contents.
    eager_input_streaming: true
    input_schema:
      type: object
      properties:
        path: {type: string, description: Path of the file to read.}
      required: [path]
  - name: write_file
    description: Write (create or replace) a text file with the given content.
    eager_input_streaming: true
    input_schema:
      type: object
      properties:
        path: {type: string, description: Path of the file to write.}
        content: {type: string, description: The full new content of the file.}
      required: [path, content]
  - name: edit_file
    description: >-
      Replace an exact piece of text in a file. old_string must match the file exactly, including
      whitespace, and occur exactly once unless replace_all is true; include enough surrounding
      lines to make it unique.
    eager_input_streaming: true
    input_schema:
      type: object
      properties:
        path: {type: string, description: Path of the file to edit.}
        old_string: {type: string, description: The exact text to replace.}
        new_string: {type: string, description: The text to put in its place.}
        replace_all: {type: boolean, description: Replace every occurrence instead of exactly one.}
      required: [path, old_string, new_string]
  - name: glob
    description: List files whose paths match a glob pattern, such as **/*.py. Skips .git and node_modules.
    eager_input_streaming: true
    input_schema:
      type: object
      properties:
        pattern: {type: string, description: "Glob pattern, relative to path; ** matches any number of directories."}
        path: {type: string, description: "Directory to search; default the working directory."}
      required: [pattern]
  - name: grep
    description: "Search file contents with a Python regular expression and return path:line: text for each match."
    eager_input_streaming: true
    input_schema:
      type: object
      properties:
        pattern: {type: string, description: The regular expression.}
        path: {type: string, description: "File or directory to search; default the working directory."}
        glob: {type: string, description: "Only search files whose name matches this glob, such as *.go."}
        ignore_case: {type: boolean}
      required: [pattern]
  # Claude Code's Skill tool. The listing of skills arrives as a <system-reminder> in the first user
  # message (scripts/skills.py context); loading one adds its instructions after the tool result.
  - name: skill
    description: >-
      Execute a skill within the main conversation. When users ask you to perform tasks, check if any
      of the available skills match. Skills provide specialized capabilities and domain knowledge.
      When a skill matches the user's request, invoking it is a BLOCKING REQUIREMENT: invoke this tool
      before generating any other response about the task. Only use skills listed in the available
      skills reminder; do not guess names. When users reference a "slash command" or "/<something>"
      (e.g. "/commit"), they are referring to a skill: use this tool to invoke it. If a
      <command-name> tag is already present in the current turn, the skill is already loaded: follow
      its instructions directly instead of calling this tool again.
    eager_input_streaming: true
    input_schema:
      type: object
      properties:
        skill: {type: string, description: "The skill name, e.g. \"commit\" or \"review-pr\"."}
        args: {type: string, description: Optional arguments for the skill.}
      required: [skill]
  # Claude Code's Agent tool. The agent types arrive as a <system-reminder> in the first user message
  # (scripts/agents.py context); the subagent's final message comes back as the tool result.
  - name: agent
    description: >-
      Launch a subagent to handle a task on its own. The subagent starts with a fresh context: it knows only
      the prompt you give it, works with its own tools, and returns only its final message, which the user
      does not see unless you relay it. Use it for searches or investigations whose intermediate results you
      don't need, to keep them out of this conversation. Pick subagent_type from the available agent types
      listed in the system reminder; Explore is read-only. Brief it like a colleague who hasn't seen this
      conversation: the goal, what you already know, where to look, and what to report. Don't use it for a
      lookup you could do in one or two tool calls yourself. Subagents run one at a time.
    eager_input_streaming: true
    input_schema:
      type: object
      properties:
        description: {type: string, description: A short (3-5 word) description of the task.}
        prompt: {type: string, description: The task for the subagent.}
        subagent_type: {type: string, description: "The agent type to use; default general-purpose."}
      required: [description, prompt]
  # Claude Code's TodoWrite: the list is shown to the user and kept in <session>.todos (scripts/todos.py).
  - name: todo_write
    description: >-
      Create and update a task list for this session, to track progress on multi-step work and show it to
      the user. Use it for tasks with three or more steps, when the user gives several tasks at once, or in
      plan mode to lay out the work; skip it for a single simple task or a question. Each call replaces the
      whole list. Mark a task in_progress before you start it (exactly one at a time) and completed as soon
      as it is done, without batching completions; only mark it completed when it is fully done (tests pass,
      nothing left unfinished). Add tasks you discover along the way, and remove ones that no longer apply.
    eager_input_streaming: true
    input_schema:
      type: object
      properties:
        todos:
          type: array
          description: The whole updated list.
          items:
            type: object
            properties:
              content: {type: string, description: "The task, in the imperative: \"Run the tests\"."}
              status: {type: string, enum: [pending, in_progress, completed]}
              activeForm: {type: string, description: "The task in the present continuous, shown while it is in progress: \"Running the tests\"."}
            required: [content, status, activeForm]
      required: [todos]
  # Claude Code's ExitPlanMode: in plan mode, asks the user to approve the plan (scripts/session.py exit-plan).
  - name: exit_plan_mode
    description: >-
      Use this when you are in plan mode and have finished planning the implementation of a task: it shows
      your plan to the user and asks them to approve it, which ends plan mode. Only for tasks that need
      changes (code, files, commands); not for research or questions, which you just answer. Make the plan
      concise and concrete: the files to change and how, in markdown.
    eager_input_streaming: true
    input_schema:
      type: object
      properties:
        plan: {type: string, description: The plan to approve, in markdown.}
      required: [plan]
